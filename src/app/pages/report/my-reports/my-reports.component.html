<section class="product-page-container">
    <app-page-header
        [title]="'Mes signalements'"
        [breadcrumbs]="['Mes signalements']">
    </app-page-header>

    <mat-card class="card">
        <div class="container mt-4">
            <!-- Champ de recherche -->
            <mat-form-field appearance="outline" style="width: 300px; margin-bottom: 20px;">
                <mat-label>Rechercher</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Filtrer par mot-clé">
            </mat-form-field>

            <!-- Tableau -->
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <!-- ID -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let r">{{ r.id }}</td>
                </ng-container>

                <!-- Produit -->
                <ng-container matColumnDef="productName">
                    <th mat-header-cell *matHeaderCellDef>Produit</th>
                    <td mat-cell *matCellDef="let r">{{ r.productName }}</td>
                </ng-container>

                <!-- Description -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let r">{{ r.description }}</td>
                </ng-container>

                <!-- Statut -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Statut</th>
                    <td mat-cell *matCellDef="let r">
                    <span class="badge"
                            [ngClass]="{
                                'badge-open': r.status === 'OPEN',
                                'badge-in-progress': r.status === 'IN_PROGRESS',
                                'badge-resolved': r.status === 'RESOLVED'
                            }">
                        {{ getStatusLabel(r.status) }}
                    </span>

                    </td>
                </ng-container>

                <!-- Date -->
                <ng-container matColumnDef="createdAt">
                    <th mat-header-cell *matHeaderCellDef>Date</th>
                    <td mat-cell *matCellDef="let r">{{ r.createdAt | date:'short' }}</td>
                </ng-container>

                <!-- Rendu -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <!-- Pagination -->
            <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
            </mat-paginator>
        </div>
    </mat-card>
</section>
