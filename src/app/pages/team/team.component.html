<div class="container total-height">

    <!-- ✅ En-tête de la page -->
    <app-page-header
        [title]="'Liste des employés'"
        [breadcrumbs]="['Liste des employés']">
    </app-page-header>

    <!-- ✅ Zone de filtres -->
    <div class="filters-container">

        <!-- 🔍 Champ de recherche (filtrage libre) -->
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Rechercher</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Rechercher un membre">
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <!-- 🎯 Filtre par rôle (ADMIN / TECH) -->
        <mat-form-field appearance="outline" class="category-field">
            <mat-label>Catégorie</mat-label>
            <mat-select [(value)]="selectedCategory" (selectionChange)="applyCategoryFilter($event.value)">
                <mat-option value="">Toutes</mat-option>
                <mat-option *ngFor="let cat of category" [value]="cat">{{ cat }}</mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <!-- ✅ Tableau des membres avec tri et pagination -->
    <div class="table-container mat-elevation-z2">
        <table mat-table [dataSource]="dataSource" matSort class="members-table">

            <!-- Colonne : Prénom -->
            <ng-container matColumnDef="firstname">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Prénom</th>
                <td mat-cell *matCellDef="let member">{{ member.firstname }}</td>
            </ng-container>

            <!-- Colonne : Nom -->
            <ng-container matColumnDef="lastname">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
                <td mat-cell *matCellDef="let member">{{ member.lastname }}</td>
            </ng-container>

            <!-- Colonne : Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                <td mat-cell *matCellDef="let member">{{ member.email }}</td>
            </ng-container>

            <!-- Colonne : Rôle -->
            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Rôle</th>
                <td mat-cell *matCellDef="let member">{{ member.role }}</td>
            </ng-container>

            <!-- Lignes -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
    </div>

    <!-- ✅ Pagination -->
    <mat-paginator #paginator
                   [length]="dataSource.filteredData.length"
                   [pageIndex]="0"
                   [pageSize]="10"
                   [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Sélectionner une page">
    </mat-paginator>
</div>
