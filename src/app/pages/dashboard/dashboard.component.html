<section class="product-page-container">
    <app-page-header
        [title]="'Bienvenue, {{ firstName }} !'"
        [breadcrumbs]="['Liste des clients']">
    </app-page-header>
    <div class="dashboard-container total-height " [@staggerCards]>
        <div class="stats-grid">
            <mat-card class="stat-card success" [@fadeSlideIn]>
                <img src="assets/icons/activity.svg" alt="Locations actives" class="stat-icon" />
                <div>
                    <h4>Locations actives</h4>
                    <p>{{ activeRentals }}</p>
                </div>
            </mat-card>

            <mat-card class="stat-card primary" [@fadeSlideIn]>
                <img src="assets/icons/boxes.svg" alt="Équipements disponibles" class="stat-icon" />
                <div>
                    <h4>Équipements disponibles</h4>
                    <p>{{ availableEquipments }}</p>
                </div>
            </mat-card>

            <mat-card class="stat-card warning" [@fadeSlideIn]>
                <img src="assets/icons/clock.svg" alt="Retards" class="stat-icon" />
                <div>
                    <h4>Retards</h4>
                    <p>{{ lateReturns }}</p>
                </div>
            </mat-card>

            <mat-card class="stat-card danger" [@fadeSlideIn]>
                <img src="assets/icons/wrench.svg" alt="En réparation" class="stat-icon" />
                <div>
                    <h4>En réparation</h4>
                    <p>{{ inRepair }}</p>
                </div>
            </mat-card>

            <mat-card class="stat-card accent" [@fadeSlideIn]>
                <img src="assets/icons/euro.svg" alt="Revenus mensuels" class="stat-icon" />
                <div>
                    <h4>Revenus mensuels</h4>
                    <p>{{ monthlyRevenue | currency: 'EUR' }}</p>
                </div>
            </mat-card>
        </div>

        <mat-card class="table-card" [@fadeSlideIn]>
            <!-- reste du contenu inchangé -->
        </mat-card>
    </div>

</section>
