<h2 mat-dialog-title>Uploader un document</h2>

<mat-dialog-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="upload-form">

        <!-- Type -->
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Type de document</mat-label>
            <mat-select formControlName="type" required>
                <mat-option *ngFor="let docType of documentTypes" [value]="docType.value">
                    {{ docType.label }}
                </mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('type')?.hasError('required')">
                Le type est obligatoire
            </mat-error>
        </mat-form-field>

        <!-- Titre -->
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Titre</mat-label>
            <input matInput formControlName="title" placeholder="Titre du document" required />
            <mat-error *ngIf="form.get('title')?.hasError('required')">
                Le titre est obligatoire
            </mat-error>
        </mat-form-field>

        <!-- Fichier -->
        <div class="file-input">
            <input type="file" (change)="onFileSelected($event)" />
            <p *ngIf="file">{{ file.name }}</p>
        </div>
        <mat-dialog-actions align="end">
            <button mat-button type="button" (click)="onCancel()">Annuler</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="!form.valid || !file">
                Envoyer
            </button>
        </mat-dialog-actions>

    </form>
</mat-dialog-content>
