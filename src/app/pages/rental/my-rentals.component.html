<app-page-header
    [title]="'Mes réservations'"
    [breadcrumbs]="['Mes réservations']">
</app-page-header>

<mat-card>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <!-- Produit -->
        <ng-container matColumnDef="productName">
            <th mat-header-cell *matHeaderCellDef>Produit</th>
            <td mat-cell *matCellDef="let rental">{{ rental.productName }}</td>
        </ng-container>

        <!-- Période -->
        <ng-container matColumnDef="period">
            <th mat-header-cell *matHeaderCellDef>Période</th>
            <td mat-cell *matCellDef="let rental">
                {{ rental.startDate | date:'shortDate' }} → {{ rental.endDate | date:'shortDate' }}
            </td>
        </ng-container>

        <!-- Statut -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Statut</th>
            <td mat-cell *matCellDef="let rental">
        <span [ngClass]="getStatusClass(rental.status)">
          {{ rental.status }}
        </span>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</mat-card>
